[package]
name = "keitora-tasks"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Keitora task store — shared task-DB library used by the CLI and the Tauri app."

[dependencies]
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"
toml_edit = "0.22"
dirs = "6"
log = "0.4"
pathdiff = "0.2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "process", "time", "io-util", "sync"] }

# Windows: 8.3 short-path conversion (GetShortPathNameW) so a claude path with
# spaces survives the bare cmd.exe launch line.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
futures = "0.3"
tempfile = "3"

[lints]
workspace = true
