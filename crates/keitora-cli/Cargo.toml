[package]
name = "keitora-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Keitora command-line interface — the unified `keitora` CLI on top of keitora-tasks."

[[bin]]
name = "keitora"
path = "src/main.rs"

[dependencies]
keitora-tasks = { path = "../keitora-tasks" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
