<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Keitora — Logistics Dispatch</title>
    <!-- Anti-FOUC: set data-theme before first paint so the app never flashes the
         wrong theme. LOCKSTEP with src/lib/theme.ts (storage key + resolution): a
         missing/invalid pref defaults to "system", which then follows the OS. -->
    <script>
      (function () {
        var m = "system";
        try {
          m = localStorage.getItem("keitora.theme") || "system";
        } catch (e) {}
        if (m !== "light" && m !== "dark" && m !== "system") m = "system";
        var dark = m === "dark";
        if (m === "system") {
          try {
            dark = matchMedia("(prefers-color-scheme: dark)").matches;
          } catch (e) {
            dark = true;
          }
        }
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
